name: README

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  readme:
    name: Generated README
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.12
          install_args: --locked
      - run: mise run readme:check
