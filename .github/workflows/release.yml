name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches version.txt
        run: |
          expected="v$(cat version.txt)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version.txt ($expected)" >&2
            exit 1
          fi

      - name: Format check
        run: pnpm agent:check

      - name: Unit tests
        run: node --test

      - name: Build distribution
        run: node build.mjs

      - name: Package distribution
        run: tar -czf "firmo-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "firmo-${GITHUB_REF_NAME}.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes
