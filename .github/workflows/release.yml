name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      delivery_commit: ${{ steps.deliver.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm agent:check

      - name: Unit tests
        run: pnpm test

      - name: Build distribution
        run: node build.mjs

      - name: Distribution and installation smoke tests
        run: pnpm test:distribution

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # The default branch is the built delivery branch `main` (no source /
          # no release-please config). release-please must target the source
          # branch `develop`, where its config and manifest live.
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Package distribution
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: tar -czf "effective-flow-${{ steps.release.outputs.tag_name }}.tar.gz" -C dist .

      - name: Upload release archive
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "effective-flow-${{ steps.release.outputs.tag_name }}.tar.gz" --clobber

      - name: Verify uploaded release archive
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_dir="$(mktemp -d)"
          asset="effective-flow-${{ steps.release.outputs.tag_name }}.tar.gz"
          gh release download "${{ steps.release.outputs.tag_name }}" --pattern "$asset" --dir "$verify_dir"
          node scripts/distribution-smoke.mjs archive "$verify_dir/$asset"

      - name: Deliver portable skill, consumer docs, and trusted automation to main
        id: deliver
        # The delivery branch `main` is the default branch, so it carries what a
        # consumer sees: exactly one portable `effective-flow/` skill candidate
        # PLUS the canonical root LICENSE, the consumer-facing docs — the
        # marketing-entry README.md and docs/user-guide/ — and the trusted
        # issue-closing workflow/helper. It deliberately does NOT carry
        # docs/developer-guide/ (develop-only), CI, or release workflows.
        # Consumers that do not run a build (dalo, `npx skills`) grab finished
        # artifacts straight from here.
        #
        # deliver-docs.mjs rewrites developer-guide links in the delivered docs to
        # absolute develop URLs (they would dangle on `main`) and appends a footer
        # pointing contributors at `develop`. This appends a fresh commit — it never
        # force-pushes — so consumer commit pins stay valid. Requires the delivery
        # branch `main` to already exist (seeded once during the develop/main
        # rollout); it does not run until a release is created.
        #
        # Renovate reads its config from the default branch, which is this delivery
        # `main`. The delivered `renovate.json` is copied from the canonical root
        # `renovate.json`, whose `baseBranchPatterns: ["develop"]` makes Renovate scan
        # manifests and open update PRs against the source branch `develop`, not the
        # config-less delivery `main`.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          work="$(mktemp -d)"
          git worktree add --force "$work" origin/main
          node scripts/stage-delivery.mjs "$work" "$GITHUB_REPOSITORY" develop
          node scripts/distribution-smoke.mjs delivery "$work"
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "No delivery changes for ${{ steps.release.outputs.tag_name }}"
          else
            git -C "$work" commit -m "chore(delivery): ${{ steps.release.outputs.tag_name }}"
            git -C "$work" push origin HEAD:main
          fi
          echo "commit=$(git -C "$work" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git worktree remove --force "$work"

      - name: Verify delivered commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${{ steps.deliver.outputs.commit }}"
          verify_work="$(mktemp -d)"
          git worktree add --detach "$verify_work" "${{ steps.deliver.outputs.commit }}"
          node scripts/distribution-smoke.mjs delivery "$verify_work"
          git worktree remove --force "$verify_work"

  update-team-catalog:
    name: Update team catalog
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create Effective Flow source token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DALO_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.DALO_CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: effective-flow
          permission-contents: read

      - name: Create team catalog target token
        id: target-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DALO_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.DALO_CATALOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: skills.sebastian-software.com
          permission-contents: write
          permission-pull-requests: write

      - name: Check out team catalog
        uses: actions/checkout@v7
        with:
          repository: sebastian-software/skills.sebastian-software.com
          ref: main
          fetch-depth: 0
          token: ${{ steps.target-token.outputs.token }}
          persist-credentials: false
          path: team-catalog

      - name: Install verified Dalo 0.9.2
        env:
          DALO_SHA256: 7f7b7b4948a5cd156948bb0a8ceaa4889c09cd6d53397c07370c663bac1343ef
        run: |
          package="dalo-0.9.2-x86_64-unknown-linux-musl"
          archive="$package.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/sebastian-software/dalo/releases/download/dalo-v0.9.2/$archive"
          echo "$DALO_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/$package/dalo" "$RUNNER_TEMP/dalo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/dalo" --version

      - name: Update Effective Flow team-catalog pin
        env:
          DALO_SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
        run: |
          node scripts/update-team-catalog.mjs \
            --repo "$GITHUB_WORKSPACE/team-catalog" \
            --delivery-commit "${{ needs.release.outputs.delivery_commit }}" \
            --release-tag "${{ needs.release.outputs.tag_name }}"
