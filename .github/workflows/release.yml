name: Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm agent:check

      - name: Unit tests
        run: pnpm test

      - name: Build distribution
        run: node build.mjs

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # The default branch is the built delivery branch `main` (no source /
          # no release-please config). release-please must target the source
          # branch `develop`, where its config and manifest live.
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Package distribution
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: tar -czf "effective-flow-${{ steps.release.outputs.tag_name }}.tar.gz" -C dist .

      - name: Upload release archive
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" "effective-flow-${{ steps.release.outputs.tag_name }}.tar.gz" --clobber

      - name: Deliver built dist and consumer docs to the delivery branch (main)
        # The delivery branch `main` is the default branch, so it carries what a
        # consumer sees: the built skill payload (both harnesses as `claude/` and
        # `codex/` at the root) PLUS the consumer-facing docs — the marketing-entry
        # README.md and docs/user-guide/. It deliberately does NOT carry
        # docs/developer-guide/ (develop-only). Consumers that do not run a build
        # (dalo, `npx skills`) grab finished artifacts straight from here.
        #
        # deliver-docs.mjs rewrites developer-guide links in the delivered docs to
        # absolute develop URLs (they would dangle on `main`) and appends a footer
        # pointing contributors at `develop`. This appends a fresh commit — it never
        # force-pushes — so consumer commit pins stay valid. Requires the delivery
        # branch `main` to already exist (seeded once during the develop/main
        # rollout); it does not run until a release is created.
        #
        # Renovate reads its config from the default branch, which is this delivery
        # `main`. The delivered `renovate.json` (scripts/delivery-renovate.json) pins
        # `baseBranches: ["develop"]` so Renovate scans manifests and opens update PRs
        # against the source branch `develop`, not the config-less delivery `main`.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          work="$(mktemp -d)"
          git worktree add --force "$work" origin/main
          rm -rf "$work/claude" "$work/codex" "$work/README.md" "$work/docs/user-guide" "$work/docs/developer-guide"
          cp -R dist/claude "$work/claude"
          cp -R dist/codex "$work/codex"
          mkdir -p "$work/docs"
          cp README.md "$work/README.md"
          cp -R docs/user-guide "$work/docs/user-guide"
          cp scripts/delivery-renovate.json "$work/renovate.json"
          node scripts/deliver-docs.mjs "$work" "$GITHUB_REPOSITORY" develop
          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "No delivery changes for ${{ steps.release.outputs.tag_name }}"
          else
            git -C "$work" commit -m "chore(delivery): ${{ steps.release.outputs.tag_name }}"
            git -C "$work" push origin HEAD:main
          fi
          git worktree remove --force "$work"
