name: Protected macOS validation

on:
  push:
    branches: ['effective-flow/validation/*']

permissions:
  contents: read

jobs:
  protected-validation:
    name: protected-validation
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout immutable validation transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4096
          persist-credentials: false
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Materialize and validate protected source
        shell: bash
        run: node scripts/protected-macos-validation.mjs run
