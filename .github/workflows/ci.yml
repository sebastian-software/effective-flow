name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Format, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.mjs stamps the git short hash into the router; fetch full
          # history so `git rev-parse --short HEAD` resolves instead of "nogit".
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm agent:check

      - name: Unit tests
        # Invoke the runner directly (not `pnpm test`) so this passes cleanly
        # before the test suite is added and runs it automatically once present.
        run: node --test

      - name: Build distribution
        run: node build.mjs

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck helper scripts
        # Gate at error severity: the scripts use the deliberate `CDPATH= cd`
        # idiom and literal backticks that trip lower-severity style warnings.
        run: shellcheck --severity=error local-update.sh local-link.sh
