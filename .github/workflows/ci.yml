name: CI

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read
  # Re-read the original protected hosted attempt and its logs for bounded admission.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

jobs:
  unit-tests:
    # Shards the unit suite; `Format, test and build` gates on every shard, so the required
    # check stays red unless all of them passed. `pnpm test:shard` assigns files by their measured
    # runtime (scripts/shard-weights.json), so the matrix length must equal the shard count in
    # the command.
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Narrower than the workflow default: the suite reads the checkout and nothing else.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The suite needs a readable Git checkout and builds stamp the short hash; keep the
          # same full history as the checks job.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No `--` separator: pnpm forwards it to the script, and the shard runner rejects it.
      # Every shard keeps the test preflight of `pnpm test`.
      - name: Unit tests
        run: pnpm test:shard ${{ matrix.shard }}/3 --test-concurrency=4

  checks:
    # The broad package checks need no test result, so they run beside the shards instead of
    # after them. `Format, test and build` gates on this job; it is not a required check itself.
    name: Build checks
    runs-on: ubuntu-latest
    # Narrower than the workflow default: no step here reads the Actions API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # build.mjs stamps the git short hash into the router; fetch full
          # history so `git rev-parse --short HEAD` resolves instead of "nogit".
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm agent:check

      - name: Build distribution
        run: node build.mjs

      - name: Distribution and installation smoke tests
        run: pnpm test:distribution

      # Keep evidence reporting after every broad package check. The same report policy applies
      # to release and ordinary PRs; the verifier rejects integrity/errors independently of debt.
      # This job has no condition and the required gate fails unless it succeeded; never omit a
      # suite: every verdict belongs in the summary.
      - name: Behavioural eval evidence
        id: behavioural
        run: |
          status=0
          for suite in merge-gate iterate next-steps build-context focus; do
            verdict="$RUNNER_TEMP/$suite-eval-verify.txt"
            suite_status=0
            pnpm eval "$suite" verify --mode report > "$verdict" 2>&1 || suite_status=$?
            cat "$verdict"
            {
              echo "### $suite eval evidence (package report; capability qualification separate)"
              echo
              echo '```'
              cat "$verdict"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$suite_status" -ne 0 ]; then
              status=$suite_status
            fi
          done
          exit "$status"

  build:
    name: Format, test and build
    needs: [unit-tests, checks]
    # The only job condition is `always()`; never let this required job be skipped. A skipped
    # required check counts as passing, so a failed, skipped or cancelled shard or checks job
    # must reach the gate step below and fail there.
    if: always()
    runs-on: ubuntu-latest
    # The gate reads only `needs` results. `contents: none` drops every scope, like
    # `permissions: {}`, which the conflict-validation YAML subset cannot parse.
    permissions:
      contents: none
    steps:
      # Each needed job's result is `success` only when it, or every shard of the matrix,
      # succeeded. The results come in through `env:`, never as an expression inside the script.
      - name: Unit test shards and build checks
        env:
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          status=0
          for pair in "unit-tests:$UNIT_TESTS_RESULT" "checks:$CHECKS_RESULT"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "Job ${pair%%:*} did not succeed (result: ${pair#*:})." >&2
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo 'Re-run the failed job, or use "Re-run failed jobs".' >&2
          fi
          exit "$status"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Shellcheck helper scripts
        # Gate at error severity: the scripts use the deliberate `CDPATH= cd`
        # idiom and literal backticks that trip lower-severity style warnings.
        run: shellcheck --severity=error install-skill.sh local-common.sh local-link.sh

  managers:
    # No version in the name, and none in the job below either. This exercises the manager
    # releases consumers actually install; pinning them meant reporting green about versions
    # nobody runs — DALO drifted three minors behind before anyone noticed (issue #299).
    #
    # Deliberately NOT a required status check. It tracks moving upstream releases, so making
    # it required would let an unrelated DALO or Skills CLI release block every merge, the
    # release pull request included (issue #282).
    name: Manager compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: node build.mjs

      - name: Install the current DALO release
        env:
          # Reading a public release of another repository in this organization. Authenticated
          # rather than a bare curl: unauthenticated API calls are limited to 60 per hour and
          # counted per IP, which shared runners share.
          GH_TOKEN: ${{ github.token }}
        run: |
          download_dir="$RUNNER_TEMP/dalo-download"
          install_dir="$RUNNER_TEMP/dalo"
          mkdir -p "$download_dir" "$install_dir"
          # No tag argument: `gh release download` then resolves the newest release itself, and
          # the glob patterns match the version-bearing asset names. Nothing has to parse a
          # version out of a tag, so there is no second place where a version format can drift.
          gh release download --repo sebastian-software/dalo \
            --pattern '*-x86_64-unknown-linux-musl.tar.gz' \
            --pattern '*-x86_64-unknown-linux-musl.tar.gz.sha256' \
            --dir "$download_dir"
          # Drop the token before anything downloaded is executed. `env:` covers the whole step,
          # so without this the freshly downloaded DALO would run with the repository token in
          # its environment — and this job deliberately made that binary a moving upstream
          # target. Read-only or not, an unpinned executable has no business seeing it.
          unset GH_TOKEN
          # The sidecar names a bare filename, so the check must run in the download directory.
          # A missing sidecar makes this fail rather than silently skip verification: the glob
          # would expand to a literal that `--check` cannot open.
          (cd "$download_dir" && sha256sum --check ./*.tar.gz.sha256)
          tar -xzf "$download_dir"/*.tar.gz -C "$install_dir" --strip-components=1
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          # Record what was actually resolved. With a moving target, a red run is only
          # actionable if the log says which version produced it.
          "$install_dir/dalo" --version

      - name: Stage the default-branch payload
        run: node scripts/stage-delivery.mjs "$RUNNER_TEMP/delivery" "$GITHUB_REPOSITORY" develop

      - name: Manager compatibility smoke tests
        run: pnpm test:managers "$RUNNER_TEMP/delivery"
